name: Bug report
description: Something behaves differently than documented or expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. For a security vulnerability, do not use this form:
        email ehtisham@eprecisio.com instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed. Paste real output rather than describing it.
      placeholder: |
        Ran `foo deploy --env staging` and it exited 1 with:

        Error: unable to resolve reference "bar"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that triggers it. A repo or snippet I can run is ideal.
      placeholder: |
        1. Clone the repo at commit abc1234
        2. Run `make setup`
        3. Run `foo deploy --env staging`
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions matter. Include whatever is relevant.
      placeholder: |
        OS:         Ubuntu 24.04
        Tool:       v1.4.2
        Kubernetes: v1.30.1 (EKS)
        Terraform:  v1.9.5
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact credentials, tokens, account IDs, and hostnames before pasting.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed all credentials and secrets from the output above.
          required: true
